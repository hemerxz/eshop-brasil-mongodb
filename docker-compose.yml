services:
  mongo:
    image: mongo:7
    container_name: eshop-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-eshop_dev_2025}
    volumes:
      - mongo_data:/data/db
    # Exposto apenas na máquina local (útil para o MongoDB Compass).
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: eshop-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-eshop_dev_2025}@mongo:27017/?authSource=admin
      MONGO_DB: eshop_brasil
    ports:
      - "8501:8501"

volumes:
  mongo_data:
